<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exibição</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: system-ui, sans-serif; }
    #tela { position: absolute; inset: 0; transition: opacity .6s; }
    #tela img, #tela video { width: 100%; height: 100%; object-fit: contain; display: block; }
    #aviso { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 2rem; text-align: center; padding: 20px; }
    #letreiro { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.75); color: #fff; font-size: 2.2rem; padding: 12px 0; white-space: nowrap; overflow: hidden; display: none; }
    #letreiro span { display: inline-block; padding-left: 100%; animation: rolar linear infinite; }
    @keyframes rolar { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  </style>
</head>
<body data-api="{{ url_for('exibicao.playlist') }}">
  <div id="tela"></div>
  <div id="aviso">Carregando…</div>
  <div id="letreiro"><span></span></div>

  <script src="{{ url_for('static', filename='player.js') }}"></script>
</body>
</html>
