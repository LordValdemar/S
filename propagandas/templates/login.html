{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block classe_main %}estreito{% endblock %}
{% block conteudo %}
<section>
  <h2>Entrar</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo"><label for="usuario">Usuário</label><input type="text" id="usuario" name="usuario" value="{{ usuario }}" autocomplete="username" required autofocus></div>
    <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" name="senha" autocomplete="current-password" required></div>
    <button type="submit">Entrar</button>
  </form>
  <p class="dica">Esqueceu a senha? Peça ao administrador da sua empresa.</p>
</section>
{% endblock %}
