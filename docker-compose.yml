# Uso:  docker compose up -d
# Comandos de administração:  docker compose exec painel python gerenciar.py listar-usuarios
services:
  painel:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./dados:/dados
    environment:
      FUSO_HORARIO: America/Sao_Paulo
      NOME_PLATAFORMA: Painel de Propagandas
      # CONTATO_PLATAFORMA: suporte@suaempresa.com.br
      # Cobrança automática (opcional), veja o README:
      # ASAAS_API_KEY: $$aact_hmlg_...     # no docker compose, "$" vira "$$"
      # ASAAS_AMBIENTE: sandbox
      # ASAAS_WEBHOOK_TOKEN: troque-por-um-token-aleatorio
      # Alertas (opcional), veja o README:
      # ALERTA_WEBHOOK: https://hooks.slack.com/services/...
      # SMTP_HOST: smtp.gmail.com
      # SMTP_USUARIO: voce@gmail.com
      # SMTP_SENHA: senha-de-app
      # ALERTA_EMAILS: dono@loja.com.br,gerente@loja.com.br
